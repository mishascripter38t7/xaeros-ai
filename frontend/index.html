<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xaeros AI</title>
    <style>
        body { font-family: monospace; background: #0f111a; color: #00ff66; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        h1 { margin-bottom: 10px; font-size: 24px; text-shadow: 0 0 10px rgba(0,255,102,0.5); }
        #chatBox { width: 100%; max-width: 600px; height: 70vh; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; overflow-y: scroll; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 6px; max-width: 80%; line-height: 1.4; word-break: break-word; }
        .message.user { background: #21262d; color: #c9d1d9; align-self: flex-end; border: 1px solid #30363d; }
        .message.ai { background: #0d1117; color: #00ff66; align-self: flex-start; border: 1px solid #00ff6633; }
        .input-area { width: 100%; max-width: 600px; display: flex; gap: 10px; margin-top: 15px; }
        input { flex: 1; background: #161b22; border: 1px solid #30363d; color: #fff; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 14px; outline: none; }
        input:focus { border-color: #00ff66; }
        button { background: #238636; color: white; border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: monospace; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>

    <h1>// XAEROS AI v1.0 //</h1>
    
    <div id="chatBox">
        <div class="message ai">Система Xaeros AI запущена. Защитные протоколы активны. Жду запрос...</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">ОТПРАВИТЬ</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
